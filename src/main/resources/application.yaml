spring:
  application:
    name: xo-clash
  ai:
    openai:
      api-key: ${open_ai_apikey}
  datasource:
    username: ${db_username}
    password: ${db_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${db_host}:${db_port}/xoclash
  jpa:
      database-platform: org.hibernate.dialect.MySQLDialect
      hibernate:
        ddl-auto: update
      show-sql: true
      properties:
        hibernate.format_sql: true
  mail:
      host: smtp.gmail.com
      port: 587
      username: ${email_username}
      password: ${email_password}
      properties:
        mail:
          smtp:
            auth: true
            starttls:
              enable: true
              required: true
              connectiontimeout: 5000
              timeout: 5000
              writetimeout: 5000
  data:
      redis:
        url: ${redis_url}

management:
    endpoint:
      health:
        show-details: always
    endpoints:
      web:
        exposure:
          include: "*"

rabbitmq:
  uri: ${rabbitmq_url}

jwt:
  secret: ${jwt_secret}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    operationsSorter: method
    tagsSorter: alpha


debug: true

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security.web: DEBUG


